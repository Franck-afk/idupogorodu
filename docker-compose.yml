services:
  db:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    ports:
      - "8080:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes

  # Одноразовый сервис: ставит WordPress, активирует наши плагины и тему.
  # Запускается автоматически при `docker compose up` (в т.ч. при создании Codespace).
  wp-setup:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    restart: "no"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./.devcontainer/install-wp.sh:/usr/local/bin/install-wp.sh:ro
    entrypoint: ["/bin/sh", "-c", "install-wp.sh"]

  # Контейнер редактора для Codespaces: PHP 8.4 + Composer + Xdebug.
  dev:
    image: mcr.microsoft.com/devcontainers/php:1-8.4-bookworm
    depends_on:
      - wordpress
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity

volumes:
  db_data: {}
  wordpress_data: {}
