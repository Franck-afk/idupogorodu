version: 2.1

jobs:
  phpunit:
    docker:
      - image: cimg/php:8.4
      - image: cimg/mysql:8.4
        environment:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
    environment:
      WP_VERSION: 7.1.1
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: ""
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
    steps:
      - checkout
      - run:
          name: Wait for MySQL
          command: dockerize -wait tcp://localhost:3306 -timeout 120s
      - run:
          name: Install system deps
          command: sudo apt-get update && sudo apt-get install -y subversion default-mysql-client
      - run:
          name: Install WordPress test library
          command: |
            cd plugins/idpg-core
            chmod +x bin/install-wp-tests.sh
            bash bin/install-wp-tests.sh $WP_DB_NAME $WP_DB_USER "$WP_DB_PASS" 127.0.0.1 $WP_VERSION true
      - run:
          name: Install PHPUnit (idpg-core dev deps)
          command: |
            cd plugins/idpg-core
            composer install --no-interaction --no-progress
      - run:
          name: PHPUnit — idpg-core
          command: |
            cd plugins/idpg-core
            composer dump-autoload
            vendor/bin/phpunit -c phpunit.xml.dist
      - run:
          name: PHPUnit — idpg-auth
          command: |
            cd plugins/idpg-auth
            ../idpg-core/vendor/bin/phpunit -c phpunit.xml.dist
      - run:
          name: PHPUnit — idpg-city-admin
          command: |
            cd plugins/idpg-city-admin
            ../idpg-core/vendor/bin/phpunit -c phpunit.xml.dist

  phpcs:
    docker:
      - image: cimg/php:8.4
    steps:
      - checkout
      # PHPCS нельзя ставить через `composer create-project`: для baseline-плагина
      # forrest79/phpcs-ignores точка инъекции жёстко привязана к пути
      # vendor/squizlabs/php_codesniffer/src/Files/FileList.php, поэтому PHPCS
      # должен быть обычной зависимостью в vendor/ (а не корневым проектом).
      #
      # Версии берём из bin/phpcs-patches/tools.composer.json (DEV-54), где они
      # пришпилены точно: `composer require "^3.12"` тянул бы другие сборки, а
      # патчи в bin/phpcs-patches/ сделаны под конкретную версию пакета.
      - run:
          name: Install PHPCS (pinned by DEV-54) + WordPress Coding Standards
          command: |
            mkdir -p /tmp/phpcs-tools
            cp bin/phpcs-patches/tools.composer.json /tmp/phpcs-tools/composer.json
            cd /tmp/phpcs-tools
            composer install --no-interaction --no-progress
      - run:
          name: Apply phpcs-ignores patches (DEV-54)
          command: |
            bash bin/phpcs-patches/apply.sh /tmp/phpcs-tools
            /tmp/phpcs-tools/vendor/bin/phpcs -i
      - run:
          name: PHPCS — idpg-core (baseline)
          command: |
            cd plugins/idpg-core
            /tmp/phpcs-tools/vendor/bin/phpcs --standard=.phpcs.xml.dist \
              --bootstrap=/tmp/phpcs-tools/vendor/forrest79/phpcs-ignores/src/bootstrap.php \
              --runtime-set ignore_warnings_on_exit 1 \
              --report=full --no-colors
      - run:
          name: PHPCS — idpg-auth (baseline)
          command: |
            cd plugins/idpg-auth
            /tmp/phpcs-tools/vendor/bin/phpcs --standard=.phpcs.xml.dist \
              --bootstrap=/tmp/phpcs-tools/vendor/forrest79/phpcs-ignores/src/bootstrap.php \
              --runtime-set ignore_warnings_on_exit 1 \
              --report=full --no-colors
      - run:
          name: PHPCS — idpg-city-admin (baseline)
          command: |
            cd plugins/idpg-city-admin
            /tmp/phpcs-tools/vendor/bin/phpcs --standard=.phpcs.xml.dist \
              --bootstrap=/tmp/phpcs-tools/vendor/forrest79/phpcs-ignores/src/bootstrap.php \
              --runtime-set ignore_warnings_on_exit 1 \
              --report=full --no-colors
      - run:
          name: PHPCS — theme idpg_core (baseline)
          command: |
            cd themes/idpg_core
            /tmp/phpcs-tools/vendor/bin/phpcs --standard=.phpcs.xml.dist \
              --bootstrap=/tmp/phpcs-tools/vendor/forrest79/phpcs-ignores/src/bootstrap.php \
              --runtime-set ignore_warnings_on_exit 1 \
              --report=full --no-colors

workflows:
  version: 2
  test:
    jobs:
      - phpunit
      - phpcs